# minimum number of items to drop from mobs
base_item_drop_count: 1
# base drop chance for a mob drop, this keeps rolling until
# there is a failure, this allows large loot drops occasionally
drop_chance: 0.6
# chance for enchanter to drop with a modifier group attached
enchanter_mod_chance: 0.01
# chance for entities to drop craftables being held
monster_craftable_drop_change: 0.1

# each world has its own drop table, but there is a base table they inherit
worlds:
  world:
    enchanters:
      tags:
        - enchanter
      types:
        WHISPERING_EMBER: 1500
        CHARM_OF_ENRICHMENT: 2500
        FATEBINDERS_PRISM: 1000
        ASCENDANT_SEAL: 1500
        CELESTIAL_CATALYST: 500
        ECHO_OF_ASCENSION: 1250
        VOIDTEAR_SIGIL: 750
        ORB_OF_FLUX: 200
        PHANTOM_REFLECTION: 100
        MARK_OF_ETERNITY: 10
        SUNDERING_RUNE: 5
        ESSENCE_SHARD: 25
    craftables:
      tags:
        - craftable
      rarity:
        normal: 700
        magic: 250
        rare: 50
      types:
        - weight: 200
          types:
            - diamond_helmet
            - diamond_chestplate
            - diamond_leggings
            - diamond_boots
            - diamond_sword
            - diamond_battleaxe
        - weight: 20
