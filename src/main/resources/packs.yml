# general pack variables
distance: # how far followers are allowed to wander from leader
  maximum: 8.0 # distance that starts movement back to leader
  minimum: 4.0 # distance that stops movement back to leader
pack_size: # minimum and maximum pack size
  minimum: 3
  maximum: 5
spawn:
  local_pack_search: 10 # minimum distance between entity packs of the same type
  count: 20 # maximum packs allowed in search area
  search: # search distances for other packs
    horizontal: 128
    vertical: 32
  distance: # maximum distance allowed away from a player
    horizontal: 80
    vertical: 20

# allowed monster types
monsters:
  # hostile mobs
  - zombie
  - zombie_villager
  - husk
  - drowned
  - skeleton
  - stray
  - bogged
  - wither_skeleton
  - spider
  - creeper
  - zombified_piglin
  - hoglin
  - zoglin

# pack modifier groups and counts
pack_quality:
  normal:
    weight: 90
    groups: 0
    modifiers: 0
  magic:
    weight: 9
    groups: 1
    modifiers: 2
    color:
      red: 0
      green: 0
      blue: 0xFF
    qualitymods:
      increased_health:
        template: AttributeTemplate
        attribute: MAX_HEALTH
        operator: MULTIPLIER
        flat: 35
  rare:
    weight: 1
    groups: 2
    modifiers: 4
    color:
      red: 0xFF
      green: 0xFF
      blue: 0
    qualitymods:
      increased_health:
        template: AttributeTemplate
        attribute: MAX_HEALTH
        operator: MULTIPLIER
        flat: 100

# for each modifier a drop luck of the same rank will be added
modifier_luck_drop:
  type: LuckConfig
  lucktype: DROP_LUCK
  ranks:
    1:
      monster: true
      flat: 5
    2:
      monster: true
      flat: 10
    3:
      monster: true
      flat: 20

# modifier groups
modifier_groups:
  # attack/damage groups
  generic_damage:
    weight: 50
    modifiers:
      - damage_all_scaler
      - critical_chance_flat
      - critical_chance_scaler
      - critical_damage_flat
      - critical_damage_scaler
      - luck_double_damage
      - luck_damage_lucky
  physical_damage:
    weight: 200
    modifiers:
      - damage_range_physical
      - damage_physical_scaler
      - damage_all_scaler
      - damage_as_extra_burn
      - damage_as_extra_frost
      - damage_as_extra_shock
      - damage_as_extra_elemental
      - damage_as_extra_havoc
      - leech_physical_damage
      - leech_all_damage
  burn_damage:
    weight: 400
    modifiers:
      - damage_range_burn
      - damage_burn_scaler
      - damage_elemental_scaler
      - damage_all_scaler
      - damage_as_extra_burn
      - leech_elemental_damage
      - leech_all_damage
  frost_damage:
