armor_piece:
  magic_modifiers:
    - flat_skill_crafting
    - flat_skill_enchanting
    - flat_skill_brewing
    - defense_flat_physical
    - defense_flat_burn
    - defense_flat_frost
    - defense_flat_shock
    - defense_flat_elemental
    - defense_flat_havoc
    - defense_scaler_physical
    - enchantment_unbreaking
    - damage_reduction_physical
    - flat_drop_luck_prefix
    - status_permanent_invisibility
    - attribute_flat_health
shield:
  material: SHIELD
  displayname: Shield
  parent: armor_piece
  itemslot: OFF_HAND
  group: SHIELD
  recipes:
    crafting:
      type: Shaped
      shape:
        - 'pip'
        - 'ppp'
        - ' p '
      materials:
        p:
          - ACACIA_PLANKS
          - BAMBOO_PLANKS
          - BIRCH_PLANKS
          - CHERRY_PLANKS
          - CRIMSON_PLANKS
          - DARK_OAK_PLANKS
          - JUNGLE_PLANKS
          - MANGROVE_PLANKS
          - OAK_PLANKS
          - PALE_OAK_PLANKS
          - SPRUCE_PLANKS
          - WARPED_PLANKS
        i:
          - IRON_INGOT
  base_modifiers:
    physical_defense:
      template: DefenseTemplate
      base: true
      damagetype: PHYSICAL
      operator: FLAT
      precision: 1
      flat: 6
      steps: 3
    block_damage:
      template: BlockDamageTemplate
      base: true
      operator: FLAT
      precision: 1
      flat: 45
      steps: 6
    reduced_movement_speed:
      template: AttributeTemplate
      base: true
      attribute: MOVEMENT_SPEED
      operator: SCALER
      flat: -5
  magic_modifiers:
    - block_damage_scalar
    - damage_reduction_burn
    - damage_reduction_frost
    - damage_reduction_shock
    - damage_reduction_elemental
    - damage_reduction_havoc
    - damage_range_physical_offhand
    - damage_range_burn_offhand
    - damage_range_frost_offhand
    - damage_range_shock_offhand
    - damage_range_havoc_offhand
    - flat_drop_luck_suffix

