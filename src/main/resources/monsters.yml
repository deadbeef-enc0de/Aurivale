# should be the baseline for all entities
default:
  modifiers:
    resistance_max_physical:
      template: DamageReductionMaxTemplate
      damagetype: PHYSICAL
      flat: 90
    resistance_max_elemental:
      template: DamageReductionMaxTemplate
      damagetype: ELEMENTAL
      flat: 90
    resistance_max_havoc:
      template: DamageReductionMaxTemplate
      damagetype: HAVOC
      flat: 90
    critical_damage_bonus:
      template: CriticalTemplate
      criticaltype: CRITICAL_DAMAGE
      operator: FLAT
      flat: 50

# baseline for all passive entities
passive:
  parent: default
  passive: true
  modifiers:
    less_drop_luck_kill:
      template: LuckTemplate
      monster: true
      lucktype: DROP_LUCK
      flat: -100

# baseline for all neutral entities
neutral:
  parent: default
  modifiers:
    less_drop_luck_kill:
      template: LuckTemplate
      monster: true
      lucktype: DROP_LUCK
      flat: -35

# players
player:
  parent: default
  modifiers:
    maximum_mana:
      template: ManaTemplate
      manatype: MAX_MANA
      operator: FLAT
      flat: 20

# attacking non-player entities
attacker:
  parent: default
  actionmodifiers:
    # sets attacks/s to 20
    attack_speed:
      template: AttributeTemplate
      attribute: ATTACK_SPEED
      operator: FLAT
      flat: 0.05

