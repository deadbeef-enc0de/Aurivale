populators:
  world_monster:
    chance: 0.005
    distribution:
      zombie: 10
      drowned: 3
      husk: 1
      skeleton: 10
      stray: 3
      wither_skeleton: 1
      creeper: 5
      evoker: 1
      pillager: 3
      vindicator: 2
      spider: 10
      cave_spider: 3
      enderman: 6
      witch: 4
  ores:
    chance: 0.025
    distribution:
      COAL_ORE: 8
      COPPER_ORE: 8
      LAPIS_ORE: 6
      IRON_ORE: 6
      NETHER_QUARTZ_ORE: 5
      GOLD_ORE: 4
      REDSTONE_ORE: 4
      DIAMOND_ORE: 2
      EMERALD_ORE: 2
      ANCIENT_DEBRIS: 1
