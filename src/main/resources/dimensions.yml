    populators:
      - StoryWorldMonsterPopulator
      - StoryLecternPopulator
      - StoryJungleTreePopulator
      - StoryJungleBushPopulator
      - StoryOrePopulator
    handler: StoryHandler
    permissions:
      filterentities: false
      filteractions: false
      blockbreak: true
      blockplace: true
  river:
    environment: NORMAL
    generator: StoryRiverDimensionGenerator
    biomes: StoryRiverBiomeGenerator
    populators:
      - StoryWorldMonsterPopulator
      - StoryLecternPopulator
      - StoryGrassPopulator
      - StoryBirchTreePopulator
      - StoryOrePopulator
