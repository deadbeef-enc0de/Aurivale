void_walk_dimension: void
worlds:
  void:
    environment: NETHER
    biomes: VoidBiomeGenerator
    terrain: VoidTerrainGenerator
    populators:
      - VoidPortalPopulator
    handler: VoidHandler
    permissions:
      filterentities: true
      allowedentities:
        - ITEM_FRAME
        - DROPPED_ITEM
        - ARMOR_STAND
      filteractions: true
      allowedactions: []
      blockbreak: false
      blockplace: false
    portals:
      x:
        min: -5120
        max: 5120
      z:
        min: -5120
        max: 5120

stories:
  plains:
    environment: NORMAL
    generator: StoryPlainsDimensionGenerator
    biomes: StoryPlainsBiomeGenerator
    populators:
      - StoryWorldMonsterPopulator
      - StoryLecternPopulator
      - StoryGrassPopulator
      - StoryLightOakTreePopulator
      - StoryOrePopulator
    handler: StoryHandler
    permissions:
      filterentities: false
      filteractions: false
      blockbreak: true
      blockplace: true
  desert:
    environment: NORMAL
    generator: StoryDesertDimensionGenerator
    biomes: StoryDesertBiomeGenerator
    populators:
      - StoryWorldMonsterPopulator
      - StoryLecternPopulator
      - StoryDeadBushPopulator
      - StoryWellPopulator
      - StoryOrePopulator
    handler: StoryHandler
    permissions:
      filterentities: false
